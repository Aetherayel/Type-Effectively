# GitHub Pages is published by GitHub's built-in branch-based Pages workflow.
# Keep CI here focused on validating the app; do not run a second Pages deploy.
name: Test static site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: V2 diagnostic audit — seeded source influence and stability
        if: github.event_name == 'pull_request'
        run: npm run audit:v2
      - name: Browser startup — verify all 19 sliders render
        run: node scripts/smoke-browser.mjs
