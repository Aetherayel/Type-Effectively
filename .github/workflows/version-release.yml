name: Version published PR merges

# GitHub Pages still deploys directly from main. This workflow only tags a
# merge after the built-in Pages publisher succeeds, never pushes a bump
# commit that would fail to trigger branch-based Pages.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from merged PR history
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          # PR #33 introduces v2.0.0; later merged PRs increment v2.0.x.
          # PR #32 still establishes the historical v1.4.0 baseline.
          # Earlier merged PRs retain their historical v1.3.x, v1.2.x and v1.1.x tags.
          v12_at=$(gh api "repos/$GITHUB_REPOSITORY/pulls/24" --jq '.merged_at // empty')
          v12_after=false
          if [ -n "$v12_at" ]; then
            if [[ "$MERGED_AT" > "$v12_at" ]] || \
              { [[ "$MERGED_AT" == "$v12_at" ]] && [ "$PR_NUMBER" -gt 24 ]; }; then
              v12_after=true
            fi
          fi

          v13_at=$(gh api "repos/$GITHUB_REPOSITORY/pulls/30" --jq '.merged_at // empty')
          v13_after=false
          if [ -n "$v13_at" ]; then
            if [[ "$MERGED_AT" > "$v13_at" ]] || \
              { [[ "$MERGED_AT" == "$v13_at" ]] && [ "$PR_NUMBER" -gt 30 ]; }; then
              v13_after=true
            fi
          fi

          v14_at=$(gh api "repos/$GITHUB_REPOSITORY/pulls/32" --jq '.merged_at // empty')
          v14_after=false
          if [ -n "$v14_at" ]; then
            if [[ "$MERGED_AT" > "$v14_at" ]] || \
              { [[ "$MERGED_AT" == "$v14_at" ]] && [ "$PR_NUMBER" -gt 32 ]; }; then
              v14_after=true
            fi
          fi

          v20_at=$(gh api "repos/$GITHUB_REPOSITORY/pulls/33" --jq '.merged_at // empty')
          v20_after=false
          if [ -n "$v20_at" ]; then
            if [[ "$MERGED_AT" > "$v20_at" ]] || \
              { [[ "$MERGED_AT" == "$v20_at" ]] && [ "$PR_NUMBER" -gt 33 ]; }; then
              v20_after=true
            fi
          fi

          if [ "$PR_NUMBER" = "33" ]; then
            tag=v2.0.0
          elif [ "$v20_after" = true ]; then
            patch=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100" |
              jq -s --arg baseline "$v20_at" \
                --arg merged "$MERGED_AT" --argjson number "$PR_NUMBER" \
                '[.[][] | select(.merged_at != null and
                  (.merged_at > $baseline or (.merged_at == $baseline and .number > 33)) and
                  (.merged_at < $merged or (.merged_at == $merged and .number <= $number)))] | length')
            if [ "$patch" -lt 1 ]; then
              echo "::error::Could not count merged PRs since the v2.0.0 baseline."
              exit 1
            fi
            tag="v2.0.$patch"
          elif [ "$PR_NUMBER" = "32" ]; then
            tag=v1.4.0
          elif [ "$v14_after" = true ]; then
            patch=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100" |
              jq -s --arg baseline "$v14_at" \
                --arg merged "$MERGED_AT" --argjson number "$PR_NUMBER" \
                '[.[][] | select(.merged_at != null and
                  (.merged_at > $baseline or (.merged_at == $baseline and .number > 32)) and
                  (.merged_at < $merged or (.merged_at == $merged and .number <= $number)))] | length')
            if [ "$patch" -lt 1 ]; then
              echo "::error::Could not count merged PRs since the v1.4.0 baseline."
              exit 1
            fi
            tag="v1.4.$patch"
          elif [ "$PR_NUMBER" = "30" ]; then
            tag=v1.3.0
          elif [ "$v13_after" = true ]; then
            patch=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100" |
              jq -s --arg baseline "$v13_at" \
                --arg merged "$MERGED_AT" --argjson number "$PR_NUMBER" \
                '[.[][] | select(.merged_at != null and
                  (.merged_at > $baseline or (.merged_at == $baseline and .number > 30)) and
                  (.merged_at < $merged or (.merged_at == $merged and .number <= $number)))] | length')
            if [ "$patch" -lt 1 ]; then
              echo "::error::Could not count merged PRs since the v1.3.0 baseline."
              exit 1
            fi
            tag="v1.3.$patch"
          elif [ "$PR_NUMBER" = "24" ]; then
            tag=v1.2.0
          elif [ "$v12_after" = true ]; then
            patch=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100" |
              jq -s --arg baseline "$v12_at" \
                --arg merged "$MERGED_AT" --argjson number "$PR_NUMBER" \
                '[.[][] | select(.merged_at != null and
                  (.merged_at > $baseline or (.merged_at == $baseline and .number > 24)) and
                  (.merged_at < $merged or (.merged_at == $merged and .number <= $number)))] | length')
            if [ "$patch" -lt 1 ]; then
              echo "::error::Could not count merged PRs since the v1.2.0 baseline."
              exit 1
            fi
            tag="v1.2.$patch"
          else
            # Original v1.1 baseline: merged PR #21.
            patch=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100" |
              jq -s --arg baseline '2026-11-21T01:52:00Z' \
                --arg merged "$MERGED_AT" --argjson number "$PR_NUMBER" \
                '[.[][] | select(.merged_at != null and .merged_at > $baseline and
                  (.merged_at < $merged or (.merged_at == $merged and .number <= $number)))] | length')
            if [ "$patch" -lt 1 ]; then
              echo "::error::Could not count merged PRs since the v1.1.0 baseline."
              exit 1
            fi
            tag="v1.1.$patch"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Version for merged PR #$PR_NUMBER: $tag"

      - name: Wait for this exact commit to go live on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100"               --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].conclusion // ""')
            if [ "$conclusion" = "success" ]; then
              echo "GitHub Pages published $MERGE_SHA"
              exit 0
            fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "::error::GitHub Pages did not publish $MERGE_SHA ($conclusion)."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out checking GitHub Pages deployment for $MERGE_SHA."
          exit 1

      - name: Tag and publish verified version
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tagged_sha=$(git rev-list -n 1 "$TAG")
            if [ "$tagged_sha" != "$MERGE_SHA" ]; then
              echo "::error::$TAG already points to a different commit."
              exit 1
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists for this merge."
            exit 0
          fi
          gh release create "$TAG" --target "$MERGE_SHA" --title "$TAG"             --notes "Live GitHub Pages release from merged PR #$PR_NUMBER (commit \`$MERGE_SHA\`)."
          echo "Published $TAG for $MERGE_SHA"
