name: Version published PR merges

# GitHub Pages still deploys directly from main. This workflow only tags a
# merge after the built-in Pages publisher succeeds, never pushes a bump
# commit that would fail to trigger branch-based Pages.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine the next patch from merged PR history
        id: version
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # PR #21 introduced v1.1.0. Every later PR merge advances x by one.
          baseline=2d7feae340f2a0fa3fc2836f077851e1f13bc48a
          git merge-base --is-ancestor "$baseline" "$MERGE_SHA" || {
            echo "::error::The v1.1.0 baseline is not an ancestor of this merge."
            exit 1
          }
          # Count first-parent PR merge commits, not arbitrary pushes or PR
          # branch commits. Supports GitHub's merge-commit and squash styles.
          patch=$(git log --first-parent --format=%s "$baseline..$MERGE_SHA" |
            grep -Ec '^(Merge pull request #[0-9]+ from |.+ \(#[0-9]+\)$)' || true)
          if [ "$patch" -lt 1 ]; then
            echo "::error::Could not identify a merged PR; rebase-only merges are not supported by the release counter."
            exit 1
          fi
          echo "tag=v1.1.$patch" >> "$GITHUB_OUTPUT"
          echo "Version for merged commit $MERGE_SHA: v1.1.$patch"

      - name: Wait for this exact commit to go live on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100"               --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].conclusion // ""')
            if [ "$conclusion" = "success" ]; then
              echo "GitHub Pages published $MERGE_SHA"
              exit 0
            fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "::error::GitHub Pages did not publish $MERGE_SHA ($conclusion)."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out checking GitHub Pages deployment for $MERGE_SHA."
          exit 1

      - name: Tag and publish verified version
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tagged_sha=$(git rev-list -n 1 "$TAG")
            if [ "$tagged_sha" != "$MERGE_SHA" ]; then
              echo "::error::$TAG already points to a different commit."
              exit 1
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists for this merge."
            exit 0
          fi
          gh release create "$TAG" --target "$MERGE_SHA" --title "$TAG"             --notes "Live GitHub Pages release from merged PR #$PR_NUMBER (commit \`$MERGE_SHA\`)."
          echo "Published $TAG for $MERGE_SHA"
