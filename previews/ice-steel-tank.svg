  <svg x="145" y="386" width="670" height="627" class="stat-radar" viewBox="0 0 360 337" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stat-radar-title stat-radar-description"><title id="stat-radar-title">Six-stat radar, adjusted values shown above base only when Nature changes a stat</title><desc id="stat-radar-description">HP: base 103; Attack: base 53; Defense: base 110; Speed: after Nature 54, base 61; Sp. Def: base 99; Sp. Atk: after Nature 119, base 109. Base stat polygon scale: zero to 140 on each axis.</desc><g class="stat-radar-grid"><polygon class="stat-radar-ring" points="180,137 203.38,150.5 203.38,177.5 180,191 156.62,177.5 156.62,150.5"/><polygon class="stat-radar-ring" points="180,110 226.77,137 226.77,191 180,218 133.23,191 133.23,137"/><polygon class="stat-radar-ring" points="180,83 250.15,123.5 250.15,204.5 180,245 109.85,204.5 109.85,123.5"/><polygon class="stat-radar-ring stat-radar-outer" points="180,56 273.53,110 273.53,218 180,272 86.47,218 86.47,110"/><line class="stat-radar-axis" x1="180" y1="164" x2="180" y2="56"/><line class="stat-radar-axis" x1="180" y1="164" x2="273.53" y2="110"/><line class="stat-radar-axis" x1="180" y1="164" x2="273.53" y2="218"/><line class="stat-radar-axis" x1="180" y1="164" x2="180" y2="272"/><line class="stat-radar-axis" x1="180" y1="164" x2="86.47" y2="218"/><line class="stat-radar-axis" x1="180" y1="164" x2="86.47" y2="110"/></g><polygon class="stat-radar-shape" points="180,84.54 215.41,143.56 253.49,206.43 180,211.06 113.86,202.19 107.18,121.96"/><g class="stat-radar-vertices"><circle class="stat-radar-point" cx="180" cy="84.54" r="3.6"/><circle class="stat-radar-point" cx="215.41" cy="143.56" r="3.6"/><circle class="stat-radar-point" cx="253.49" cy="206.43" r="3.6"/><circle class="stat-radar-point" cx="180" cy="211.06" r="3.6"/><circle class="stat-radar-point" cx="113.86" cy="202.19" r="3.6"/><circle class="stat-radar-point" cx="107.18" cy="121.96" r="3.6"/></g><g class="stat-radar-labels"><g class="stat-radar-label" transform="translate(180 20)"><text class="stat-radar-label-name" y="-4">HP</text><text class="stat-radar-label-single" y="15">103</text></g><g class="stat-radar-label" transform="translate(313 87)"><text class="stat-radar-label-name" y="-4">Attack</text><text class="stat-radar-label-single" y="15">53</text></g><g class="stat-radar-label" transform="translate(313 230)"><text class="stat-radar-label-name" y="-4">Defense</text><text class="stat-radar-label-single" y="15">110</text></g><g class="stat-radar-label" transform="translate(180 305)"><text class="stat-radar-label-name" y="-4">Speed</text><text class="stat-radar-label-effective stat-drop" y="11">↓54</text><text class="stat-radar-label-base" y="25">61</text></g><g class="stat-radar-label" transform="translate(47 230)"><text class="stat-radar-label-name" y="-4">Sp. Def</text><text class="stat-radar-label-single" y="15">99</text></g><g class="stat-radar-label" transform="translate(47 87)"><text class="stat-radar-label-name" y="-4">Sp. Atk</text><text class="stat-radar-label-effective stat-boost" y="11">↑119</text><text class="stat-radar-label-base" y="25">109</text></g></g></svg>
